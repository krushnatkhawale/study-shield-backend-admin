server:
  port: 8081

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyshield}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

vaadin:
  launch-browser: false

studyshield:
  backend:
    base-url: ${STUDYSHIELD_BACKEND_URL:http://localhost:8080}
