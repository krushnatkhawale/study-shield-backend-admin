server:
  port: ${PORT:8082}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/studyshield}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

vaadin:
  launch-browser: false

studyshield:
  backend:
    base-url: ${STUDYSHIELD_BACKEND_URL:https://study-shield-backend-komv.onrender.com}
    prod-base-url: ${STUDYSHIELD_BACKEND_PROD_URL:http://localhost:8082}
    username: ${STUDYSHIELD_BACKEND_USERNAME:}
    password: ${STUDYSHIELD_BACKEND_PASSWORD:}
    connect-timeout-ms: ${STUDYSHIELD_BACKEND_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${STUDYSHIELD_BACKEND_READ_TIMEOUT_MS:10000}
